[project]
name = "tp1-recherche-semantique"
version = "0.2.0"
description = "Moteur de recherche sémantique sur un corpus d'articles scientifiques courts (INF5101, TP texte)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arxiv>=2.1",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
