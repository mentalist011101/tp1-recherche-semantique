[project]
name = "moteur"
version = "1.0.0"
description = "API du moteur de recherche d'articles scientifiques (INF5101, TP texte)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143",
    "langchain-groq>=1.1.3",
    "langchain-pinecone>=0.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001 : les guillemets et tirets typographiques du français sont voulus.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# La consigne du modèle doit rester identique, ligne pour ligne, à celle du notebook.
"src/moteur/rag.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel.fastapi.static]
# Le middleware GZip ferait garder le front dans la fonction : on le veut sur le CDN.
cdn = true
