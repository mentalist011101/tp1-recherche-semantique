[project]
name = "semantica"
version = "0.1.0"
description = "Moteur de recherche sémantique, RAG et exploration d'embeddings sur le cours INF5101"
authors = [
    { name = "Luciano", email = "luciano.fokouo@valione-services.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.2.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "huggingface-hub>=1.0",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "pystemmer>=2.2",
    "umap-learn>=0.5.6",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
semantica = "semantica.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501 : seuls les prompts et textes de test dépassent, le formateur gère le code.
# RUF001 : les guillemets et tirets typographiques du français sont voulus.
ignore = ["E501", "RUF001", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
